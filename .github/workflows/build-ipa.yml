name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout EasyTier
        run: git clone --depth 1 https://github.com/EasyTier/EasyTier.git "$RUNNER_TEMP/EasyTier"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/EasyTier/target
          key: easytier-ios-${{ hashFiles('**/Cargo.toml') }}-${{ github.run_id }}
          restore-keys: easytier-ios-

      - name: Build libeasytier_ios.a
        run: |
          chmod +x scripts/ci-build-rust.sh
          ./scripts/ci-build-rust.sh "$RUNNER_TEMP/EasyTier"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project Terracotta.xcodeproj \
            -scheme Terracotta \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Terracotta.app"
          ls -la "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # 清掉残留的签名信息，避免自签工具误判
          rm -rf Payload/Terracotta.app/_CodeSignature || true
          rm -rf Payload/Terracotta.app/PlugIns/TerracottaTunnel.appex/_CodeSignature || true
          zip -qr Terracotta-unsigned.ipa Payload
          ls -lh Terracotta-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Terracotta-unsigned-ipa
          path: Terracotta-unsigned.ipa
          retention-days: 30
